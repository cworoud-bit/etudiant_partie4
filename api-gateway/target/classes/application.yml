spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Activer la découverte de services via Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # Route vers etudiant-service
        - id: etudiant-service
          uri: lb://etudiant-service
          predicates:
            - Path=/api/etudiants/**,/api/departements/**

        # Route vers grading-service
        - id: grading-service
          uri: lb://grading-service
          predicates:
            - Path=/api/notes/**

      # CORS global — autorise le frontend Next.js
      globalcors:
        # Hetha y'na7i el headers el m3awda ki yabda el microservice zeyyed men 3andou
        add-to-idm-headers: false
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
