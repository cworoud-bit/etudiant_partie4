# .github/workflows/test-report.yml
name: Test Report

on:
  push:
    branches: [ version-4 ]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          cd api-spring-boot
          mvn test

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit Tests
          path: api-spring-boot/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false